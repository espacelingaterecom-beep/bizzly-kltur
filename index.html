function syModal(h){var e=document.getElementById("ov2");if(!h){if(e)e.remove();return}if(!e){e=document.createElement("div");e.id="ov2";e.className="ov";document.body.appendChild(e)}e.innerHTML='<div class="card" style="max-width:360px;width:100%;margin:0">'+h+'<button class="btn sec" style="margin:10px 0 0" onclick="syModal()">Fermer</button></div>'}
function syMsg(m){var e=document.getElementById("sy_msg");if(e)e.textContent=m||""}
function syShow(){if(!SENS("reset",syShow))return;if(!SY.Y)return;var c=syFmt(SY.Y.key);syModal('<h2 style="margin:0 0 6px">Code de liaison</h2><div class="mu">Sur l’autre téléphone : « Lier ce téléphone », puis saisissez ce code.</div><div style="font:700 20px/1.4 Sora,Inter,monospace;letter-spacing:1px;text-align:center;margin:14px 0;word-break:break-all;user-select:all">'+c+'</div><div class="g2"><button class="btn" style="margin:0" onclick="syShare()">Partager</button><button class="btn sec" style="margin:0" onclick="syCopy()">Copier</button></div>')}
function syShare(){var t="Code Bizzly pour "+ACC.name+" : "+syFmt(SY.Y.key);if(navigator.share)navigator.share({text:t}).catch(function(){});else syCopy()}
function syCopy(){try{navigator.clipboard.writeText(syFmt(SY.Y.key));toast("Code copié.")}catch(e){toast("Copie impossible : recopiez le code à la main.")}}
async function syEnable(){if(!SENS("reset",syEnable))return;var key=syGen();syMsg("Connexion en cours…");
 try{await rpc("bz_create",{p_key:key,p_name:ACC.name});SY.Y={key:key,seq:0,snap:{}};SY.dead=0;SY.dirty=1;sySave();SY.busy=1;try{await syPush();await syPull();SY.st="ok";SY.last=Date.now()}finally{SY.busy=0}render();syShow()}
 catch(e){SY.Y=null;try{localStorage.removeItem("bz-sync-"+ACC.id)}catch(x){}syMsg(/Failed to fetch|Load failed|NetworkError|aborted/i.test(e.message+e.name)?"Pas de connexion à Internet (ou page sans accès réseau).":"Échec : "+e.message)}}
async function syRotate(){if(!SENS("reset",syRotate))return;var nk=syGen();try{await rpc("bz_rotate",{p_key:SY.Y.key,p_new_key:nk});SY.Y.key=nk;sySave();SY.dead=0;syShow();toast("Nouveau code actif. Les autres téléphones doivent se relier.")}catch(e){syMsg("Échec : "+e.message)}}
function syOff(){ask("Désactiver la synchronisation sur ce téléphone ? Les données restent ici et en ligne. Vous pourrez la réactiver avec le code.",function(){try{localStorage.removeItem("bz-sync-"+ACC.id)}catch(e){}SY.Y=null;SY.st="off";render()})}
async function syHist(){try{var L=await rpc("bz_snaps",{p_key:SY.Y.key});syModal('<h2 style="margin:0 0 6px">Sauvegardes en ligne</h2><div class="mu">Une copie complète est prise chaque nuit (14 jours conservés). Restaurer remplace les données de tous les téléphones liés.</div>'+(L.length?L.map(function(x){return'<button class="btn sec" style="margin:8px 0 0;text-align:left" data-d="'+esc(x.day)+'" onclick="syRestore(this.dataset.d)">'+esc(x.day.split("-").reverse().join("/"))+' · '+(+x.n||0)+' éléments</button>'}).join(""):'<div class="mu" style="margin-top:10px">Aucune copie pour l’instant : la première est prise cette nuit.</div>'))}catch(e){syMsg("Échec : "+e.message)}}
async function syRestore(day){if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!SENS("restore",function(){syRestore(day)}))return;
 try{var snap=await rpc("bz_snap_get",{p_key:SY.Y.key,p_day:day});if(!Array.isArray(snap))throw new Error("copie introuvable");var st=blank();st.srv=S.srv;snap.forEach(function(x){if(x&&x.k&&x.k!="acct/1"&&typeof x.k=="string")syApplyDoc(st,x.k,x.d,x.d==null)});syFinish(st);
  ask("Remplacer toutes les données par la copie du "+day.split("-").reverse().join("/")+" ?",function(){syModal();S=st;syncSrv();SY.dirty=1;save();note("Restauration de la copie du "+day);go("home")})}catch(e){syMsg("Échec : "+e.message)}}
/* --- liaison d'un nouveau téléphone --- */
function linkv(){return AUTHBAR()+'<h1 class="ah1">Lier ce téléphone</h1><div class="card"><div class="mu">Demandez le code de liaison au gérant (Plus > Entreprise, profils et accès > Code de liaison).</div><div class="mu" style="margin-top:10px">Code</div><input id="lk_code" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" style="font-family:monospace;letter-spacing:1px"><div id="lk_err" class="err"></div><button class="btn" onclick="linkGo()">Lier ce téléphone</button></div><button class="btn sec" onclick="authTo(\''+(ACCS.list.length?"pick":"signup")+'\')">← Retour</button>'}
async function linkGo(){var code=syNorm(document.getElementById("lk_code").value),er=document.getElementById("lk_err"),bt=document.querySelector(".auth .btn");er.textContent="";
 if(code.length!=20){er.textContent="Le code doit avoir 20 caractères.";return}
 if(ACCS.list.some(function(a){var y=syLoad(a.id);return y&&y.key==code})){er.textContent="Ce téléphone est déjà lié à cette entreprise.";return}
 bt.disabled=true;er.textContent="Connexion…";
 try{var docs=[],since=0,rec=false;for(var g=0;g<200;g++){var r=await rpc("bz_pull",{p_key:code,p_since:since,p_recent:rec});(r.docs||[]).forEach(function(x){docs.push(x)});since=Math.max(since,+r.seq||0);if(!r.more)break}
  var ac=docs.filter(function(x){return x.k=="acct/1"&&!x.del&&x.d})[0];if(!ac)throw new Error("Aucune entreprise trouvée pour ce code.");
  var A=cleanAcc(Object.assign({},ac.d,{id:"s"+Date.now().toString(36)}));if(!A)throw new Error("Données de l’entreprise invalides.");
  while(ACCS.list.some(function(x){return x.ident==A.ident}))A.ident+="-2";
  var st=blank();docs.forEach(function(x){if(x.k!="acct/1")syApplyDoc(st,x.k,x.d,!!x.del||x.d==null)});syFinish(st);
  var sv=S,sa=ACC;S=st;ACC=A;var D=syDocs();S=sv;ACC=sa;var snap={};for(var k in D)snap[k]=h53(D[k]);
  localStorage.setItem("bz-data-"+A.id,JSON.stringify(st));localStorage.setItem("bz-sync-"+A.id,JSON.stringify({key:code,seq:since,snap:snap}));
  ACCS.list.push(A);ACCS.last=A.id;accsSave();AUTH.bid=A.id;AUTH.m="prof";toast("Téléphone lié à « "+A.name+" ».");authRender()}
 catch(e){bt.disabled=false;er.textContent=/invalid key/.test(e.message)?"Code incorrect.":/Failed to fetch|Load failed|NetworkError|aborted/i.test(e.message+e.name)?"Pas de connexion à Internet.":e.message}}

/* --- relier avec un nouveau code (apres un changement de code) --- */
function syRekey(){syModal('<h2 style="margin:0 0 6px">Nouveau code de liaison</h2><div class="mu">Saisissez le nouveau code donné par le gérant.</div><input id="rk_code" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" style="font-family:monospace;letter-spacing:1px;margin-top:8px"><div id="rk_err" class="err"></div><button class="btn" onclick="syRekeyGo()">Relier</button>')}
async function syRekeyGo(){var c=syNorm(document.getElementById("rk_code").value),e=document.getElementById("rk_err");if(c.length!=20){e.textContent="Le code doit avoir 20 caractères.";return}
 try{var ac=null,since=0;for(var g=0;g<200&&!ac;g++){var r=await rpc("bz_pull",{p_key:c,p_since:since,p_recent:false});ac=(r.docs||[]).filter(function(x){return x.k=="acct/1"&&!x.del&&x.d})[0]||null;since=Math.max(since,+r.seq||0);if(!r.more)break}
  if(!ac||String(ac.d.name)!=ACC.name){e.textContent="Ce code n’appartient pas à cette entreprise.";return}
  SY.Y.key=c;SY.Y.seq=0;SY.dead=0;SY.dirty=1;SY.seen={};sySave();syModal();toast("Téléphone relié.");syCycle()}
 catch(x){e.textContent=/invalid key/.test(x.message)?"Code incorrect.":/Failed to fetch|Load failed|NetworkError|aborted/i.test(x.message+x.name)?"Pas de connexion à Internet.":x.message}}

boot();
</script></body></html>
